{% extends 'base.html' %}
{% block title %}로그인 - 복용안전{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>로그인</h2>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% for field in form %}
      <div class="form-group">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <span class="field-error">{{ field.errors|join:", " }}</span>
        {% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn-save" style="width:100%; margin-top:8px;">로그인</button>
    </form>
    <p class="auth-switch">계정이 없으신가요? <a href="/accounts/signup/">회원가입</a></p>
  </div>
</div>
{% endblock %}
