<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}복용안전 판단 서비스{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">💊 복용안전</a>
    <form action="/search/" method="get" class="search-bar">
      <input type="text" name="q" placeholder="약품명, 성분, 용도로 검색..." value="{{ request.GET.q }}">
      <button type="submit">검색</button>
    </form>
    <nav>
      <a href="/analyze/">상호작용 분석</a>
      {% if user.is_authenticated %}
        <a href="/accounts/profile/" class="nav-profile">
          👤 {{ user.username }}
        </a>
        <a href="/accounts/logout/" class="nav-logout">로그아웃</a>
      {% else %}
        <a href="/accounts/login/" class="nav-login">로그인</a>
        <a href="/accounts/signup/" class="nav-signup">회원가입</a>
      {% endif %}
    </nav>
  </header>

  {% if messages %}
  <div class="message-area">
    {% for msg in messages %}
    <div class="message message-{{ msg.tags }}">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>⚠️ 본 서비스는 의학적 진단을 대체하지 않습니다. 복용 전 반드시 의사·약사와 상담하세요.</p>
  </footer>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
