<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form>
    <input type="text" name="name">
    <input type="submit" value="내 나이는?">
  </form>

  <section>
    <!-- 여기에 내용 추가 -->
  </section>
  <!-- axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
  <script>
    // axios로 get 요청 보내기
    // axios({
    //   method: 'get',
    //   url: 'correct URL',
    //   params: {
    //     key: value
    //   }
    // });

    const url = "https://api.agify.io"

    // const response = await fetch(url);
    // console.log(await response.json());

    // form 태그
    const form = document.querySelector('form')
    // name이 "name"인 input 태그
    const nameInput = document.querySelector('[name="name"]')
    // api로 받아온 데이터를 보여줄 영역
    const section = document.querySelector('section')

    form.addEventListener('submit', (event) => {
      event.preventDefault()

      // 입력값 저장
      const name = nameInput.value

      axios({
        method: 'GET',
        url: 'https://api.agify.io',
        params: {
          name: name,
        }
      })
      .then((response) => {
        const age = response.data.age

        const ageP = document.createElement('p')
        ageP.textContent = `예상 나이 : ${age}세`

        section.appendChild(ageP)
      })
      .catch((error) => {
        console.error(error)
      })

      // 이름 출력
      const nameP = document.createElement('p')
      nameP.textContent = `제 이름은 : ${name} 입니다.`

      section.appendChild(nameP)

      // 입력창 초기화
      nameInput.value = ''
    })
      // axios를 사용하여 얻은 값으로 나머지 기능을 완성한다.
      // 사용 방법은 주석 참고


  </script>
</body>
</html>
